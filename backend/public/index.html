<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevOps Demo App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-5" style="max-width:640px">
<div class="card shadow-sm"><div class="card-body text-center">
<h2>Website Health Monitoring System</h2><hr>
<h4>Application Status: <span id="st" class="badge bg-secondary">...</span></h4>
<p class="mb-1">Server: <b id="srv"></b> | Container: <b id="ctr"></b></p>
<p>Environment: <b id="env"></b></p>
<button id="fail" class="btn btn-danger">Simulate Failure</button>
<p id="msg" class="text-muted mt-3 mb-0"></p></div></div></div>
<script>
// Relative URLs so this works behind Nginx at /app/
async function load(){
  try{
    const s=await (await fetch('api/status')).json();
    st.textContent=s.status; st.className='badge bg-'+(s.status==='RUNNING'?'success':'danger');
    srv.textContent=s.server; ctr.textContent=s.container; env.textContent=s.environment;
  }catch{ st.textContent='DOWN'; st.className='badge bg-danger'; }
}
fail.onclick=async()=>{ const r=await (await fetch('api/simulate-failure',{method:'POST'})).json(); msg.textContent=r.message; load(); };
load(); setInterval(load,3000);
</script></body></html>

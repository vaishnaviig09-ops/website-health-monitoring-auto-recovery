# Optional reverse proxy. Install: sudo apt install nginx
# Copy to /etc/nginx/sites-available/health-monitor, symlink into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    location /app/ { proxy_pass http://127.0.0.1:3000/; proxy_set_header Host $host; }
    location /     { proxy_pass http://127.0.0.1:4000;   proxy_set_header Host $host; }
}

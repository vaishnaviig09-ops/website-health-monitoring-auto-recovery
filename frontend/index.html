<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health Monitoring Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-4">
<h2 class="text-center mb-3">Website Health Monitoring System</h2>
<div id="alert" class="alert d-none"></div>
<div class="card text-center mb-3 shadow-sm"><div class="card-body">
  <div class="text-muted">Application Status</div>
  <h1 id="status" class="display-5">...</h1>
  <button id="sim" class="btn btn-danger">SIMULATE FAILURE</button>
</div></div>
<div class="row g-3 mb-3" id="cards"></div>
<h5>Recent Health Checks</h5>
<div class="table-responsive mb-4"><table class="table table-sm table-striped bg-white"><thead><tr>
<th>Time</th><th>Status</th><th>HTTP</th><th>Response</th><th>Error</th></tr></thead><tbody id="checks"></tbody></table></div>
<h5>Incident History</h5>
<div class="table-responsive"><table class="table table-sm table-striped bg-white"><thead><tr>
<th>ID</th><th>Start</th><th>End</th><th>Reason</th><th>Downtime</th><th>Action</th><th>Recovery</th></tr></thead><tbody id="inc"></tbody></table></div>
</div>
<script>
const t = s => s ? new Date(s).toLocaleTimeString() : '-';
const box = (label, v) => `<div class="col-6 col-md-3"><div class="card text-center shadow-sm"><div class="card-body">
  <div class="text-muted small">${label}</div><div class="fs-4 fw-bold">${v}</div></div></div></div>`;
async function refresh() {
  let d;
  try { d = await (await fetch('/api/dashboard')).json(); } catch { return; }
  const m = d.metrics, ok = m.status === 'healthy';
  status.textContent = m.status === 'unknown' ? 'WAITING...' : (ok ? '🟢 HEALTHY' : '🔴 UNHEALTHY');
  status.className = 'display-5 ' + (ok ? 'text-success' : 'text-danger');
  const a = { failure: ['alert-danger', '⚠ APPLICATION FAILURE DETECTED. Automatic recovery initiated.'],
    recovered: ['alert-success', '✓ APPLICATION RECOVERED. Recovery completed successfully.'],
    failed: ['alert-warning', '✖ RECOVERY FAILED. Incident remains active.'] }[m.alert];
  alert.className = 'alert ' + (a ? a[0] : 'd-none'); alert.textContent = a ? a[1] : '';
  cards.innerHTML = box('Response Time', m.lastResponseTime == null ? '-' : m.lastResponseTime + ' ms')
    + box('Avg Response', m.avgResponseTime == null ? '-' : m.avgResponseTime + ' ms')
    + box('Uptime', m.uptime + '%') + box('Total Checks', m.totalChecks)
    + box('Failed Checks', m.failedChecks) + box('Automatic Recoveries', m.recoveries)
    + box('Consecutive Failures', m.consecutiveFailures) + box('Incidents', m.incidents);
  checks.innerHTML = d.checks.map(c => `<tr><td>${t(c.timestamp)}</td>
    <td class="${c.status === 'healthy' ? 'text-success' : 'text-danger'}">${c.status.toUpperCase()}</td>
    <td>${c.status_code ?? '-'}</td><td>${c.response_time == null ? '-' : c.response_time + ' ms'}</td><td>${c.error ?? '-'}</td></tr>`).join('');
  inc.innerHTML = d.incidents.map(i => `<tr><td>${i.incident_id}</td><td>${t(i.start_time)}</td><td>${t(i.end_time)}</td>
    <td>${i.reason}</td><td>${i.downtime == null ? 'ongoing' : i.downtime + ' sec'}</td><td>${i.recovery_action}</td><td>${i.recovery_status}</td></tr>`).join('')
    || '<tr><td colspan="7" class="text-center text-muted">No incidents</td></tr>';
}
sim.onclick = async () => { await fetch('/api/simulate-failure', { method: 'POST' }); refresh(); };
refresh(); setInterval(refresh, 3000);
</script></body></html>
